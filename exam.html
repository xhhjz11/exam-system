<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品质文化能力测评</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1a73e8;--primary-dark:#1557b0;--primary-light:#e8f0fe;--success:#34a853;--danger:#ea4335;--warning:#fbbc04;--gray:#f1f3f4;--gray-dark:#5f6368;--gray-border:#dadce0;--white:#fff;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);--radius:8px}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#f5f7fa;color:#202124;line-height:1.6;min-height:100vh}
.hidden{display:none!important}

/* ===== Landing Page ===== */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a73e8 0%,#4285f4 100%)}
.landing-card{background:var(--white);border-radius:16px;padding:48px 40px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center}
.landing-card h1{font-size:1.75rem;color:var(--primary);margin-bottom:8px}
.landing-card .subtitle{color:var(--gray-dark);font-size:.95rem;margin-bottom:32px}
.landing-card .form-group{margin-bottom:20px;text-align:left}
.landing-card label{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem;color:#3c4043}
.landing-card input{width:100%;padding:12px 16px;border:2px solid var(--gray-border);border-radius:var(--radius);font-size:1rem;transition:border-color .2s;font-family:inherit}
.landing-card input:focus{outline:none;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 32px;border:none;border-radius:var(--radius);font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:var(--white)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary:disabled{background:#aecbfa;cursor:not-allowed;transform:none}
.btn-success{background:var(--success);color:var(--white)}
.btn-success:hover{background:#2d9249}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{background:#d33426}
.btn-outline{background:var(--white);color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:6px}
.btn-block{width:100%}

/* ===== Exam Page ===== */
.exam-header{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:2px solid var(--primary);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.exam-header .exam-title{font-size:1.1rem;font-weight:700;color:var(--primary)}
.exam-header .timer{display:flex;align-items:center;gap:8px;font-size:1.2rem;font-weight:700;padding:6px 16px;border-radius:20px;background:var(--primary-light);color:var(--primary)}
.exam-header .timer.warning{background:#fce8e6;color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.exam-header .paper-badge{background:var(--primary);color:var(--white);padding:4px 14px;border-radius:12px;font-size:.85rem;font-weight:600}

.exam-body{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 60px)}

/* Sidebar */
.sidebar{width:220px;flex-shrink:0;background:var(--white);border-right:1px solid var(--gray-border);padding:16px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar h3{font-size:.9rem;color:var(--gray-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-border)}
.sidebar .section-label{font-size:.8rem;color:var(--gray-dark);margin:12px 0 6px;font-weight:600}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav-item{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;background:var(--gray);color:var(--gray-dark);border:2px solid transparent}
.nav-item.answered{background:#e6f4ea;color:var(--success);border-color:var(--success)}
.nav-item:hover{transform:scale(1.1);border-color:var(--primary)}
.nav-item.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,115,232,.3)}

/* Main content */
.exam-main{flex:1;padding:24px;max-width:800px}
.section-block{background:var(--white);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.section-block h2{font-size:1.15rem;color:var(--primary);margin-bottom:4px;padding-bottom:10px;border-bottom:2px solid var(--primary-light)}
.section-block .section-info{font-size:.85rem;color:var(--gray-dark);margin-bottom:16px}
.question{padding:20px 0;border-bottom:1px solid var(--gray-border)}
.question:last-child{border-bottom:none}
.question .q-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.question .q-num{background:var(--primary);color:var(--white);min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:2px}
.question .q-text{font-size:.95rem;flex:1}
.question .q-score{font-size:.8rem;color:var(--gray-dark);background:var(--gray);padding:2px 8px;border-radius:10px;flex-shrink:0;margin-top:2px}

/* Options */
.options{margin-left:36px}
.option{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin-bottom:6px;border-radius:6px;cursor:pointer;transition:background .15s}
.option:hover{background:var(--primary-light)}
.option input{margin-top:4px;accent-color:var(--primary);width:18px;height:18px;flex-shrink:0}
.option label{cursor:pointer;font-size:.95rem;flex:1}

/* Judge buttons */
.judge-options{margin-left:36px;display:flex;gap:16px}
.judge-btn{flex:1;max-width:200px;padding:16px;border:2px solid var(--gray-border);border-radius:var(--radius);background:var(--white);cursor:pointer;text-align:center;font-size:1.5rem;font-weight:700;transition:all .2s;font-family:inherit}
.judge-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.judge-btn.selected{border-color:var(--primary);background:var(--primary);color:var(--white)}
.judge-btn .judge-label{font-size:.8rem;color:var(--gray-dark);margin-top:4px}
.judge-btn.selected .judge-label{color:rgba(255,255,255,.8)}

/* Fill blank & Essay */
.answer-input{margin-left:36px}
.answer-input input,.answer-input textarea{width:100%;padding:10px 14px;border:2px solid var(--gray-border);border-radius:6px;font-size:.95rem;font-family:inherit;transition:border-color .2s;resize:vertical}
.answer-input input:focus,.answer-input textarea:focus{outline:none;border-color:var(--primary)}
.answer-input textarea{min-height:200px}

/* Submit area */
.submit-area{text-align:center;padding:32px 0}
.submit-area .btn{font-size:1.1rem;padding:14px 48px}

/* Exam table in essay questions */
.exam-table{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:.95rem;border:1px solid var(--gray-border);border-radius:6px;overflow:hidden}
.exam-table th{background:#e8f0fe;padding:8px 12px;text-align:center;font-weight:600;border:1px solid var(--gray-border);color:#1a73e8}
.exam-table td{padding:8px 12px;text-align:center;border:1px solid var(--gray-border);background:var(--white)}

/* Overlay / Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--white);border-radius:12px;padding:32px;max-width:440px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.2);text-align:center}
.modal h3{font-size:1.2rem;margin-bottom:12px}
.modal p{color:var(--gray-dark);margin-bottom:24px}
.modal .btn-group{display:flex;gap:12px;justify-content:center}

/* Submitted page */
.submitted-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.submitted-card{background:var(--white);border-radius:16px;padding:48px 40px;text-align:center;max-width:460px;width:100%;box-shadow:var(--shadow)}
.submitted-card .icon{font-size:4rem;margin-bottom:16px}
.submitted-card h2{color:var(--success);margin-bottom:8px}
.submitted-card p{color:var(--gray-dark)}

/* ===== Admin Page ===== */
.admin-page{max-width:1100px;margin:0 auto;padding:24px}
.admin-page h1{font-size:1.5rem;color:var(--primary);margin-bottom:24px}
.admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.admin-login-card{background:var(--white);border-radius:16px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow)}
.admin-login-card h2{color:var(--primary);margin-bottom:24px}
.admin-login-card input{width:100%;padding:12px 16px;border:2px solid var(--gray-border);border-radius:var(--radius);font-size:1rem;margin-bottom:16px;font-family:inherit}
.admin-login-card input:focus{outline:none;border-color:var(--primary)}

/* Dashboard table */
.dashboard{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dashboard-header{padding:20px 24px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dashboard-header h2{font-size:1.1rem;color:var(--primary)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat-item{padding:6px 16px;background:var(--primary-light);border-radius:20px;font-size:.85rem;color:var(--primary);font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:var(--primary-light);color:var(--primary);font-weight:600;text-align:left;padding:12px 16px;font-size:.85rem;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--gray-border);font-size:.9rem}
tr:hover td{background:#f8f9fa}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-pending{background:#fef7e0;color:#b45309}
.badge-graded{background:#e6f4ea;color:var(--success)}
.badge-a{background:#e8f0fe;color:var(--primary)}
.badge-b{background:#fce8e6;color:var(--danger)}

/* Grading view */
.grading-view{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.grading-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--gray-border)}
.grading-header h2{font-size:1.2rem;color:var(--primary)}
.grading-section{margin-bottom:32px}
.grading-section h3{font-size:1rem;color:var(--primary);padding:10px 16px;background:var(--primary-light);border-radius:6px;margin-bottom:16px}
.grade-q{padding:16px;border:1px solid var(--gray-border);border-radius:6px;margin-bottom:16px}
.grade-q .gq-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grade-q .gq-num{background:var(--primary);color:var(--white);min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.grade-q .gq-text{font-size:.9rem;flex:1}
.grade-q .gq-score-badge{font-size:.8rem;background:var(--gray);padding:2px 10px;border-radius:10px;color:var(--gray-dark)}
.grade-q .gq-student-answer{margin:8px 0 0 36px;padding:10px 14px;background:#f8f9fa;border-radius:6px;font-size:.9rem;white-space:pre-wrap}
.grade-q .gq-ref-answer{margin:8px 0 0 36px;padding:10px 14px;background:#e6f4ea;border-radius:6px;font-size:.85rem;color:#137333;white-space:pre-wrap}
.grade-q .gq-ref-label{margin:4px 0 0 36px;font-size:.75rem;color:var(--gray-dark);font-weight:600}
.grade-q .gq-rubric{margin:4px 0 0 36px;font-size:.8rem;color:var(--gray-dark);font-style:italic}
.auto-correct{color:var(--success);font-weight:600}
.auto-wrong{color:var(--danger);font-weight:600}
.auto-unanswered{color:var(--gray-dark);font-weight:600}
.auto-score-display{margin-left:36px;padding:6px 12px;background:#f8f9fa;border-radius:4px;font-size:.9rem;margin-bottom:8px}

.grade-input-row{margin:12px 0 0 36px;display:flex;align-items:center;gap:10px}
.grade-input-row label{font-weight:600;font-size:.9rem;white-space:nowrap}
.grade-input-row input{width:80px;padding:8px 12px;border:2px solid var(--gray-border);border-radius:6px;font-size:.95rem;text-align:center;font-family:inherit}
.grade-input-row input:focus{outline:none;border-color:var(--primary)}
.grade-input-row .max-hint{font-size:.8rem;color:var(--gray-dark)}
.grade-actions{display:flex;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--gray-border);justify-content:space-between;flex-wrap:wrap}

/* Score notification link */
.score-link-area{margin-top:16px;padding:16px;background:var(--primary-light);border-radius:8px;text-align:center}
.score-link-area p{font-size:.9rem;margin-bottom:8px}
.score-link-area code{word-break:break-all;font-size:.85rem;background:var(--white);padding:8px 12px;border-radius:4px;display:block;margin-top:8px}

/* Score view page */
.score-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a73e8 0%,#4285f4 100%)}
.score-card{background:var(--white);border-radius:16px;padding:40px;max-width:500px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.score-card h2{text-align:center;color:var(--primary);margin-bottom:24px}
.score-card .total-score{text-align:center;font-size:3rem;font-weight:700;color:var(--primary);margin-bottom:24px}
.score-card .total-score small{font-size:1rem;color:var(--gray-dark)}
.score-card table{width:100%;border-collapse:collapse;margin-bottom:20px}
.score-card th,.score-card td{padding:8px 12px;border-bottom:1px solid var(--gray-border);font-size:.9rem;text-align:left}
.score-card th{color:var(--gray-dark);font-weight:600}
.score-card .student-info{text-align:center;margin-bottom:16px;color:var(--gray-dark);font-size:.9rem}

/* Responsive */
@media(max-width:768px){
  .exam-body{flex-direction:column}
  .sidebar{width:100%;position:relative;height:auto;top:auto;border-right:none;border-bottom:1px solid var(--gray-border);max-height:180px}
  .sidebar .nav-grid{grid-template-columns:repeat(10,1fr)}
  .nav-item{font-size:.7rem}
  .exam-main{padding:16px}
  .section-block{padding:16px}
  .exam-header{padding:8px 12px;flex-wrap:wrap;gap:8px}
  .exam-header .exam-title{font-size:.95rem}
  .exam-header .timer{font-size:1rem;padding:4px 12px}
  .options{margin-left:0}
  .judge-options{margin-left:0}
  .answer-input{margin-left:0}
  .admin-page{padding:12px}
  th,td{padding:8px 10px;font-size:.8rem}
  .landing-card{padding:32px 24px}
  .grade-input-row{margin-left:0}
  .grade-q .gq-student-answer,.grade-q .gq-ref-answer,.grade-q .gq-ref-label,.grade-q .gq-rubric{margin-left:0}
}

/* ===== Toast Notification ===== */
.toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 20px;border-radius:8px;color:var(--white);font-size:.9rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .3s ease;display:flex;align-items:center;gap:10px;max-width:360px}
.toast-success{background:var(--success)}
.toast-info{background:var(--primary)}
.toast-warning{background:#e8710a}
.toast-out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ===== Polling Indicator ===== */
.polling-indicator{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--gray-dark);padding:4px 12px;border-radius:20px;background:var(--gray)}
.polling-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.polling-dot.active{background:var(--success);animation:pollPulse 1.5s infinite}
.polling-dot.inactive{background:#bbb;animation:none}
@keyframes pollPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,168,83,.4)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(52,168,83,0)}}

/* ===== New Row Highlight ===== */
@keyframes rowFlash{0%,100%{background:var(--white)}25%{background:#e6f4ea}50%{background:var(--white)}75%{background:#e6f4ea}}
.row-new{animation:rowFlash 1.5s ease 2}
</style>

</head>
<body>

<!-- ===== Landing Page ===== -->
<div id="landing-page" class="landing">
  <div class="landing-card">
    <h1>品质文化能力测评</h1>
    <p class="subtitle">请输入信息后开始考试，系统将随机分配试卷</p>
    <div class="form-group">
      <label for="student-id">工号</label>
      <input type="text" id="student-id" placeholder="请输入工号" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="student-name">姓名</label>
      <input type="text" id="student-name" placeholder="请输入姓名" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="student-dept">基地部门</label>
      <input type="text" id="student-dept" placeholder="请输入基地部门" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="start-btn" onclick="startExam()">开始考试</button>
  </div>
</div>

<!-- ===== Exam Page ===== -->
<div id="exam-page" class="hidden">
  <div class="exam-header">
    <div>
      <div class="exam-title">品质文化能力测评</div>
    </div>
    <span class="paper-badge" id="paper-badge">A卷</span>
    <div class="timer" id="timer">90:00</div>
  </div>
  <div class="exam-body">
    <div class="sidebar">
      <h3>答题卡</h3>
      <div id="nav-container"></div>
    </div>
    <div class="exam-main" id="exam-main"></div>
  </div>
</div>

<!-- ===== Submitted Page ===== -->
<div id="submitted-page" class="hidden submitted-page">
  <div class="submitted-card">
    <div class="icon">&#9989;</div>
    <h2>试卷已提交</h2>
    <p id="submitted-msg">客观题得分：<strong id="submitted-score"></strong> 分（满分 50 分）</p>
    <p style="color:var(--gray-dark);margin-top:8px;font-size:.9rem">主观题（填空+论述）需管理员批改后公布总分</p>
    <div style="margin-top:24px;background:var(--gray);border-radius:var(--radius);padding:16px;text-align:left">
      <p style="font-size:.85rem;color:var(--success);margin-bottom:8px;font-weight:600">&#9989; 答卷已自动同步到云端，管理员可实时查看并批改</p>
      <textarea id="submission-code" readonly style="width:100%;height:80px;border:1px solid var(--gray-border);border-radius:6px;padding:10px;font-size:.75rem;font-family:monospace;resize:none;background:#f8f9fa"></textarea>
      <button class="btn btn-primary btn-sm btn-block" style="margin-top:8px" onclick="copySubmissionCode()">&#128203; 复制答卷编码</button>
    </div>
  </div>
</div>

<!-- ===== Admin Login ===== -->
<div id="admin-login" class="hidden admin-login">
  <div class="admin-login-card">
    <h2>管理员登录</h2>
    <input type="password" id="admin-pwd" placeholder="请输入管理密码" autocomplete="off">
    <button class="btn btn-primary btn-block" onclick="adminLogin()">进入管理</button>
  </div>
</div>

<!-- ===== Admin Dashboard ===== -->
<div id="admin-dashboard" class="hidden admin-page">
  <h1>考试管理后台</h1>
  <div class="dashboard">
    <div class="dashboard-header">
      <h2>提交记录</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div class="polling-indicator" id="polling-indicator">
          <div class="polling-dot inactive" id="polling-dot"></div>
          <span id="polling-text">已暂停</span>
        </div>
        <button class="btn btn-primary btn-sm" onclick="syncFromCloud()">&#9729;&#65039; 手动同步</button>
        <button class="btn btn-outline btn-sm" onclick="showImportModal()">&#128229; 导入答卷编码</button>
        <button class="btn btn-outline btn-sm" onclick="exportSubmissionJSON()">&#128190; 导出数据</button>
      </div>
      <div class="stats" id="stats-area"></div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>序号</th><th>工号</th><th>姓名</th><th>基地部门</th><th>试卷</th><th>提交时间</th><th>客观题得分</th><th>主观题状态</th><th>总分</th><th>操作</th></tr></thead>
        <tbody id="submissions-tbody"></tbody>
      </table>
    </div>
  </div>

// ==================== SUPABASE API FUNCTIONS ====================
async function cloudUpload(submission) {
  try {
    const {code, id, ...cleanSub} = submission;
    const row = {
      sub_id: id,
      emp_id: cleanSub.empId || '',
      name: cleanSub.name || '',
      department: cleanSub.department || '',
      paper_version: cleanSub.paperVersion || 'A',
      answers: cleanSub.answers || {},
      submit_time: cleanSub.submitTime || '',
      auto_score: cleanSub.autoScore || 0,
      manual_scores: cleanSub.manualScores || {},
      total_score: cleanSub.totalScore || null,
      graded: cleanSub.graded || false
    };
    const {error} = await _sb.from('submissions').upsert(row, { onConflict: 'sub_id' });
    if (!error) { console.log('Supabase upload OK'); return true; }
    console.warn('Supabase upload error:', error.message);
    return false;
  } catch(e) {
    console.warn('Supabase upload failed:', e);
    return false;
  }
}

async function cloudDownload() {
  try {
    const {data, error} = await _sb
      .from('submissions')
      .select('*')
      .order('created_at', {ascending: false})
      .limit(1000);
    if (error) {
      console.warn('Supabase query error:', error.message);
      return null;
    }
    return (data || []).map(r => ({
      id: r.sub_id,
      empId: r.emp_id || '',
      name: r.name || '',
      department: r.department || '',
      paperVersion: r.paper_version || 'A',
      answers: r.answers || {},
      submitTime: r.submit_time || '',
      autoScore: r.auto_score || 0,
      manualScores: r.manual_scores || {},
      totalScore: r.total_score || null,
      graded: r.graded || false
    }));
  } catch(e) {
    console.warn('Supabase download failed:', e);
    return null;
  }
}

async function cloudSyncManualScores(submissionId, manualScores, graded) {
  try {
    const manualTotal = Object.values(manualScores).reduce((a,b) => a + (Number(b)||0), 0);
    // First get the auto_score from existing record
    const {data: existing, error: qError} = await _sb
      .from('submissions')
      .select('auto_score')
      .eq('sub_id', submissionId)
      .single();
    if (qError) { console.warn('Query error:', qError.message); return false; }
    const autoScore = (existing && existing.auto_score) || 0;
    const {error} = await _sb
      .from('submissions')
      .update({
        manual_scores: manualScores,
        graded: graded,
        total_score: graded ? (autoScore + manualTotal) : null
      })
      .eq('sub_id', submissionId);
    if (!error) return true;
    console.warn('Supabase sync error:', error.message);
    return false;
  } catch(e) {
    console.warn('Supabase sync scores failed:', e);
    return false;
  }
}

// ==================== TOAST ====================
function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.innerHTML = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast-out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// ==================== ADMIN POLLING ====================
function startAdminPolling() {
  stopAdminPolling();
  // Update indicator
  const dot = document.getElementById('polling-dot');
  const text = document.getElementById('polling-text');
  if (dot) dot.className = 'polling-dot active';
  if (text) text.textContent = '实时监控中';

  // Initial sync
  pollCloudOnce();
  // Poll every 10 seconds
  adminPollingInterval = setInterval(pollCloudOnce, 10000);
}

function stopAdminPolling() {
  if (adminPollingInterval) {
    clearInterval(adminPollingInterval);
    adminPollingInterval = null;
  }
  const dot = document.getElementById('polling-dot');
  const text = document.getElementById('polling-text');
  if (dot) dot.className = 'polling-dot inactive';
  if (text) text.textContent = '已暂停';
}

async function pollCloudOnce() {
  try {
    const cloudSubs = await cloudDownload();
    if (!cloudSubs) return;

    let submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
    const existingIds = new Set(submissions.map(s => s.id));
    let newSubs = [];

    cloudSubs.forEach(cs => {
      if (!existingIds.has(cs.id)) {
        if (!cs.manualScores) cs.manualScores = {};
        if (cs.graded && cs.totalScore === undefined) {
          cs.totalScore = cs.autoScore + Object.values(cs.manualScores).reduce((a,b)=>a+(Number(b)||0),0);
        }
        submissions.push(cs);
        existingIds.add(cs.id);
        newSubs.push(cs);
      } else {
        // Sync grading results from cloud
        const local = submissions.find(s => s.id === cs.id);
        if (cs.graded && cs.manualScores) {
          local.manualScores = cs.manualScores;
          local.graded = cs.graded;
          local.totalScore = cs.totalScore || (cs.autoScore + Object.values(cs.manualScores).reduce((a,b)=>a+(Number(b)||0),0));
        }
      }
    });

    localStorage.setItem('exam_submissions', JSON.stringify(submissions));
    lastCloudSubCount = cloudSubs.length;

    if (newSubs.length > 0) {
      renderDashboard();
      const names = newSubs.map(s => s.name).join('、');
      showToast('&#128276; 收到 ' + newSubs.length + ' 份新答卷：' + names, 'success', 5000);
      // Browser notification
      if (Notification.permission === 'granted') {
        new Notification('新答卷提醒', { body: '收到 ' + newSubs.length + ' 份新答卷：' + names, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📝</text></svg>' });
      }
      // Highlight new rows
      setTimeout(() => {
        const tbody = document.getElementById('submissions-tbody');
        if (!tbody) return;
        const rows = tbody.querySelectorAll('tr');
        // New submissions are at the end (most recent)
        const startIdx = Math.max(0, rows.length - newSubs.length);
        for (let i = startIdx; i < rows.length; i++) {
          rows[i].classList.add('row-new');
          setTimeout(() => rows[i].classList.remove('row-new'), 3000);
        }
      }, 50);
    } else if (currentView === 'admin' && document.getElementById('admin-dashboard') && !document.getElementById('admin-dashboard').classList.contains('hidden')) {
      // No new subs but we're on dashboard - check if grading status changed
      renderDashboard();
    }
  } catch(e) {
    console.warn('Polling error:', e);
  }
}

// ==================== EXAM RENDERING ====================
function renderExam() {
  const paper = EXAM_DATA[paperVersion];
  const main = document.getElementById('exam-main');
  let html = `<div style="text-align:center;margin-bottom:20px"><h2 style="color:var(--primary)">${paper.title}</h2><p style="color:var(--gray-dark);font-size:.9rem">考试时间${paper.time}分钟 | 满分${paper.total}分</p><p style="font-size:.9rem">工号：${studentInfo.empId} | 考生：${studentInfo.name} | 基地部门：${studentInfo.department || studentInfo.dept}</p></div>`;
  paper.sections.forEach(section => {
    html += `<div class="section-block"><h2>${section.name}</h2><div class="section-info">${section.info}</div>`;
    section.questions.forEach(q => {
      html += renderQuestion(q, section.id);
    });
    html += '</div>';
  });
  html += `<div class="submit-area"><button class="btn btn-primary" onclick="showSubmitConfirm()">交卷</button></div>`;
  main.innerHTML = html;
}

function renderQuestion(q, sectionId) {
  let inner = '';
  if (sectionId === 'single') {
    inner = renderSingleChoice(q);
  } else if (sectionId === 'multi') {
    inner = renderMultiChoice(q);
  } else if (sectionId === 'judge') {
    inner = renderJudge(q);
  } else if (sectionId === 'fill') {
    inner = renderFill(q);
  } else if (sectionId === 'essay') {
    inner = renderEssay(q);
  }
  return `<div class="question" id="q-${q.id}"><div class="q-header"><span class="q-num">${q.id.replace(/^[AB]/,'')}</span><span class="q-text">${markdownToHtml(q.text)}</span><span class="q-score">${q.score}分</span></div>${inner}</div>`;
}

// Convert markdown-style tables in text to HTML tables
function markdownToHtml(text) {
  // Convert markdown table to HTML table
  const lines = text.split('\n');
  let result = [];
  let inTable = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('|') && line.endsWith('|')) {
      if (!inTable) {
        inTable = true;
        result.push('<table class="exam-table">');
      }
      // Skip separator row like |---|---|
      if (/^\|[\s\-:|]+\|$/.test(line)) continue;
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      // First row = header
      if (result[result.length - 1] === '<table class="exam-table">') {
        result.push('<thead><tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>');
      } else {
        result.push('<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>');
      }
    } else {
      if (inTable) {
        result.push('</tbody></table>');
        inTable = false;
      }
      result.push(lines[i]);
    }
  }
  if (inTable) result.push('</tbody></table>');
  return result.join('\n').replace(/\n/g, '<br>').replace(/<table class="exam-table">/g, '<table class="exam-table">').replace(/<\/table><br>/g, '</table>');
}

function renderSingleChoice(q) {
  const letters = 'ABCD';
  return `<div class="options">${q.options.map((opt,i) => `<div class="option" onclick="selectSingle('${q.id}','${letters[i]}')"><input type="radio" name="q_${q.id}" id="opt_${q.id}_${i}" value="${letters[i]}" ${answers[q.id]===letters[i]?'checked':''}><label for="opt_${q.id}_${i}">${letters[i]}. ${opt}</label></div>`).join('')}</div>`;
}

function renderMultiChoice(q) {
  const letters = 'ABCD';
  const sel = answers[q.id] || [];
  return `<div class="options">${q.options.map((opt,i) => `<div class="option" onclick="toggleMulti('${q.id}','${letters[i]}')"><input type="checkbox" name="q_${q.id}" id="opt_${q.id}_${i}" value="${letters[i]}" ${sel.includes(letters[i])?'checked':''}><label for="opt_${q.id}_${i}">${letters[i]}. ${opt}</label></div>`).join('')}</div>`;
}

function renderJudge(q) {
  const sel = answers[q.id] || '';
  return `<div class="judge-options"><button type="button" class="judge-btn ${sel==='√'?'selected':''}" onclick="selectJudge('${q.id}','√')">&#10003;<div class="judge-label">正确</div></button><button type="button" class="judge-btn ${sel==='×'?'selected':''}" onclick="selectJudge('${q.id}','×')">&#10007;<div class="judge-label">错误</div></button></div>`;
}

function renderFill(q) {
  return `<div class="answer-input"><input type="text" id="fill_${q.id}" placeholder="请输入答案" value="${answers[q.id]||''}" oninput="saveFill('${q.id}',this.value)"></div>`;
}

function renderEssay(q) {
  if (q.subQuestions && q.subQuestions.length) {
    let html = `<div style="margin:12px 0 8px;padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #f9a825"><strong>请分别回答以下小题：</strong></div>`;
    q.subQuestions.forEach((sq,i) => {
      html += `<div style="margin-bottom:12px;padding:10px;background:var(--gray);border-radius:6px">
        <div style="font-weight:600;margin-bottom:6px">${sq.label} ${sq.text} <span style="color:var(--primary);font-weight:700">（${sq.score}分）</span></div>
        <div class="answer-input"><textarea id="essay_${sq.id}" placeholder="请输入${sq.label}的答案" oninput="saveEssay('${sq.id}',this.value)" style="min-height:80px">${answers[sq.id]||''}</textarea></div>
      </div>`;
    });
    return html;
  }
  return `<div class="answer-input"><textarea id="essay_${q.id}" placeholder="请输入答案" oninput="saveEssay('${q.id}',this.value)">${answers[q.id]||''}</textarea></div>`;
}

// ==================== ANSWER HANDLERS ====================
function selectSingle(qid, val) {
  answers[qid] = val;
  renderExam();
  renderNav();
  scrollToQuestion(qid);
}

function toggleMulti(qid, letter) {
  if (!answers[qid]) answers[qid] = [];
  const idx = answers[qid].indexOf(letter);
  if (idx > -1) answers[qid].splice(idx,1);
  else answers[qid].push(letter);
  answers[qid].sort();
  renderExam();
  renderNav();
  scrollToQuestion(qid);
}

function selectJudge(qid, val) {
  answers[qid] = val;
  renderExam();
  renderNav();
  scrollToQuestion(qid);
}

function saveFill(qid, val) {
  answers[qid] = val;
  renderNav();
}

function saveEssay(qid, val) {
  answers[qid] = val;
  renderNav();
}

function scrollToQuestion(qid) {
  setTimeout(() => {
    const el = document.getElementById('q-' + qid);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

// ==================== NAV SIDEBAR ====================
function renderNav() {
  const paper = EXAM_DATA[paperVersion];
  let html = '';
  paper.sections.forEach(section => {
    html += `<div class="section-label">${section.name}</div><div class="nav-grid">`;
    section.questions.forEach(q => {
      const answered = isAnswered(q, section.id);
      html += `<div class="nav-item ${answered?'answered':''}" onclick="scrollToQuestion('${q.id}')">${q.id.replace(/^[AB]/,'')}</div>`;
    });
    html += '</div>';
  });
  document.getElementById('nav-container').innerHTML = html;
}

function isAnswered(q, sectionId) {
  const a = answers[q.id];
  if (!a) return false;
  if (sectionId === 'multi') return a.length > 0;
  if (sectionId === 'fill' || sectionId === 'essay') return a.trim().length > 0;
  return true;
}

// ==================== TIMER ====================
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
      return;
    }
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (timeLeft <= 300) timerEl.classList.add('warning');
    else timerEl.classList.remove('warning');
  }, 1000);
}

// ==================== SUBMIT ====================
function showSubmitConfirm() {
  const paper = EXAM_DATA[paperVersion];
  const totalQ = paper.sections.reduce((s,sec) => s + sec.questions.length, 0);
  const answeredQ = paper.sections.reduce((s,sec) => s + sec.questions.filter(q => isAnswered(q, sec.id)).length, 0);
  const unanswered = totalQ - answeredQ;
  document.getElementById('modal-title').textContent = '确认交卷？';
  document.getElementById('modal-msg').textContent = unanswered > 0 ? `还有 ${unanswered} 题未作答，确定要提交吗？` : '提交后将无法修改答案';
  document.getElementById('confirm-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('confirm-modal').classList.add('hidden');
}

function confirmSubmit() {
  closeModal();
  submitExam();
}

function submitExam() {
  if (timerInterval) clearInterval(timerInterval);
  const paper = EXAM_DATA[paperVersion];
  let autoScore = 0;
  // Auto-grade single, multi, judge
  paper.sections.forEach(section => {
    if (['single','multi','judge'].includes(section.id)) {
      section.questions.forEach(q => {
        const studentAnswer = answers[q.id];
        let correct = false;
        if (section.id === 'single') {
          correct = studentAnswer === q.answer;
        } else if (section.id === 'multi') {
          const sa = (studentAnswer || []).sort().join('');
          correct = sa === q.answer.split('').sort().join('');
        } else if (section.id === 'judge') {
          correct = studentAnswer === q.answer;
        }
        if (correct) autoScore += q.score;
      });
    }
  });

  const submission = {
    id: 'sub_' + Date.now() + '_' + Math.random().toString(36).substr(2,6),
    empId: studentInfo.empId,
    name: studentInfo.name,
    department: studentInfo.department || studentInfo.dept,
    paperVersion,
    answers: JSON.parse(JSON.stringify(answers)),
    submitTime: new Date().toLocaleString('zh-CN'),
    autoScore,
    manualScores: {},
    totalScore: null,
    graded: false
  };

  let submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  submissions.push(submission);
  localStorage.setItem('exam_submissions', JSON.stringify(submissions));

  // Generate submission code for admin import
  const code = 'VHST-EXAM-v2|' + submission.id + '|' + submission.empId + '|' + submission.name + '|' + (submission.department||'') + '|' + submission.paperVersion + '|' + submission.submitTime + '|' + submission.autoScore + '|' + btoa(unescape(encodeURIComponent(JSON.stringify(submission.answers))));
  submission.code = code;
  localStorage.setItem('exam_submissions', JSON.stringify(submissions));

  hideAll();
  document.getElementById('submitted-page').classList.remove('hidden');
  document.getElementById('submitted-score').textContent = submission.autoScore;
  document.getElementById('submission-code').value = code;
  currentView = 'submitted';

  // Auto copy to clipboard
  copySubmissionCode();

  // Auto upload to cloud (silent, non-blocking)
  cloudUpload(submission).then(ok => {
    if (ok) {
      console.log('✅ 答卷已同步到云端');
    } else {
      console.warn('⚠️ 云端同步失败，请手动复制编码发给管理员');
    }
  });
}

function copySubmissionCode() {
  const ta = document.getElementById('submission-code');
  ta.select();
  ta.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = event ? event.target : null;
    if (btn) { btn.textContent = '✅ 已复制到剪贴板'; setTimeout(() => { btn.textContent = '📋 复制答卷编码'; }, 2000); }
  }).catch(() => {
    document.execCommand('copy');
  });
}

async function syncFromCloud() {
  const btn = event ? event.target : null;
  if (btn) btn.textContent = '⏳ 同步中...';
  try {
    const cloudSubs = await cloudDownload();
    if (cloudSubs === null) {
      alert('云端同步失败，请检查网络连接');
      if (btn) btn.innerHTML = '&#9729;&#65039; 从云端同步';
      return;
    }
    if (!cloudSubs.length) {
      alert('云端暂无答卷数据');
      if (btn) btn.innerHTML = '&#9729;&#65039; 从云端同步';
      return;
    }
    let submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
    const existingIds = new Set(submissions.map(s => s.id));
    let imported = 0;
    cloudSubs.forEach(cs => {
      if (!existingIds.has(cs.id)) {
        // Ensure required fields
        if (!cs.manualScores) cs.manualScores = {};
        if (!cs.totalScore && cs.graded) {
          cs.totalScore = cs.autoScore + Object.values(cs.manualScores).reduce((a,b)=>a+(Number(b)||0),0);
        }
        submissions.push(cs);
        existingIds.add(cs.id);
        imported++;
      } else {
        // Update existing with cloud data (merge manualScores if graded)
        const local = submissions.find(s => s.id === cs.id);
        if (cs.graded && cs.manualScores) {
          local.manualScores = cs.manualScores;
          local.graded = cs.graded;
          local.totalScore = cs.totalScore || (cs.autoScore + Object.values(cs.manualScores).reduce((a,b)=>a+(Number(b)||0),0));
        }
      }
    });
    localStorage.setItem('exam_submissions', JSON.stringify(submissions));
    renderDashboard();
    alert(`同步完成！云端共 ${cloudSubs.length} 条答卷，新增 ${imported} 条`);
  } catch(e) {
    alert('同步出错：' + e.message);
  }
  if (btn) btn.innerHTML = '&#9729;&#65039; 从云端同步';
}

function exportSubmissionJSON() {
  const submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  if (!submissions.length) { alert('暂无答卷数据'); return; }
  // Strip code field for export
  const exportData = submissions.map(s => { const {code, ...rest} = s; return rest; });
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = '答卷数据_' + new Date().toLocaleDateString('zh-CN') + '.json'; a.click();
  URL.revokeObjectURL(url);
}

function showImportModal() {
  document.getElementById('import-modal').classList.remove('hidden');
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-textarea').focus();
}

function closeImportModal() {
  document.getElementById('import-modal').classList.add('hidden');
}

function doImportSubmissions() {
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) { alert('请粘贴答卷编码'); return; }
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('VHST-EXAM-v'));
  if (!lines.length) { alert('未识别到有效的答卷编码，请检查格式'); return; }
  let imported = 0, skipped = 0;
  let submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  const existingIds = new Set(submissions.map(s => s.id));
  lines.forEach(line => {
    try {
      const parts = line.split('|');
      const isV2 = line.startsWith('VHST-EXAM-v2|');
      if (isV2 && parts.length < 9) return;
      if (!isV2 && parts.length < 8) return;
      const subId = isV2 ? parts[1] : parts[1];
      if (existingIds.has(subId)) { skipped++; return; }
      const answers = JSON.parse(decodeURIComponent(escape(atob(isV2 ? parts[8] : parts[7]))));
      const sub = {
        id: subId,
        empId: isV2 ? parts[2] : '',
        name: isV2 ? parts[3] : parts[2],
        department: isV2 ? parts[4] : parts[3],
        paperVersion: isV2 ? parts[5] : parts[4],
        submitTime: isV2 ? parts[6] : parts[5],
        autoScore: parseInt(isV2 ? parts[7] : parts[6]) || 0,
        answers,
        manualScores: {},
        totalScore: null,
        graded: false
      };
      submissions.push(sub);
      existingIds.add(subId);
      imported++;
    } catch(e) { console.warn('Import error:', e); }
  });
  localStorage.setItem('exam_submissions', JSON.stringify(submissions));
  closeImportModal();
  alert(`导入完成！成功 ${imported} 条，跳过重复 ${skipped} 条`);
  renderDashboard();
}

// ==================== ADMIN ====================
function showAdminLogin() {
  currentView = 'admin';
  hideAll();
  document.getElementById('admin-login').classList.remove('hidden');
}

function adminLogin() {
  const pwd = document.getElementById('admin-pwd').value;
  if (pwd === 'vhst2026') {
    showDashboard();
  } else {
    alert('密码错误');
  }
}

function showDashboard() {
  hideAll();
  document.getElementById('admin-dashboard').classList.remove('hidden');
  // Request notification permission
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  startAdminPolling();
}

function renderDashboard() {
  const submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  const total = submissions.length;
  const graded = submissions.filter(s => s.graded).length;
  const pending = total - graded;

  document.getElementById('stats-area').innerHTML = `<span class="stat-item">总提交：${total}</span><span class="stat-item">已批改：${graded}</span><span class="stat-item">待批改：${pending}</span>`;

  const tbody = document.getElementById('submissions-tbody');
  if (total === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--gray-dark)">暂无提交记录</td></tr>';
    return;
  }

  tbody.innerHTML = submissions.map((sub, i) => {
    const manualTotal = Object.values(sub.manualScores || {}).reduce((a,b) => a + (Number(b)||0), 0);
    const totalScore = sub.graded ? (sub.autoScore + manualTotal) : '-';
    const isFail = sub.graded && totalScore < 90;
    const scoreClass = isFail ? 'color:var(--danger);font-weight:700' : '';
    const failBadge = isFail ? ' <span class="badge badge-pending">不及格</span>' : '';
    return `<tr>
      <td>${i+1}</td>
      <td>${sub.empId || '-'}</td>
      <td>${sub.name}</td>
      <td>${sub.department}</td>
      <td><span class="badge ${sub.paperVersion==='A'?'badge-a':'badge-b'}">${sub.paperVersion}卷</span></td>
      <td>${sub.submitTime}</td>
      <td>${sub.autoScore}</td>
      <td><span class="badge ${sub.graded?'badge-graded':'badge-pending'}">${sub.graded?'已批改':'待批改'}</span></td>
      <td style="${scoreClass}">${totalScore}${failBadge}</td>
      <td><button class="btn btn-primary btn-sm" onclick="openGrading('${sub.id}')">${sub.graded?'查看':'批改'}</button> ${sub.graded?`<button class="btn btn-outline btn-sm" onclick="notifyStudent('${sub.id}')">通知考生</button>`:''}</td>
    </tr>`;
  }).join('');
}

function backToDashboard() {
  showDashboard();
}

// ==================== GRADING ====================
function openGrading(subId) {
  currentGradingId = subId;
  stopAdminPolling();
  const submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  const sub = submissions.find(s => s.id === subId);
  if (!sub) return;
  hideAll();
  document.getElementById('grading-view').classList.remove('hidden');
  renderGrading(sub);
}

function renderGrading(sub) {
  const paper = EXAM_DATA[sub.paperVersion];
  document.getElementById('grading-title').textContent = `批改试卷 - ${sub.name} (${sub.paperVersion}卷)`;

  let html = '';
  // Auto-graded sections
  ['single','multi','judge'].forEach(secId => {
    const section = paper.sections.find(s => s.id === secId);
    if (!section) return;
    html += `<div class="grading-section"><h3>${section.name}（自动批改）</h3>`;
    section.questions.forEach(q => {
      const sa = sub.answers[q.id];
      let correct = false;
      let displayAnswer = sa || '未作答';
      let statusClass = 'auto-unanswered';
      let statusText = '未作答';

      if (secId === 'single') {
        correct = sa === q.answer;
        if (sa) { statusClass = correct ? 'auto-correct' : 'auto-wrong'; statusText = correct ? '正确' : '错误'; }
      } else if (secId === 'multi') {
        const sortedSa = (sa || []).sort().join('');
        const sortedAns = q.answer.split('').sort().join('');
        correct = sortedSa === sortedAns;
        displayAnswer = (sa && sa.length) ? sa.sort().join('') : '未作答';
        if (sa && sa.length) { statusClass = correct ? 'auto-correct' : 'auto-wrong'; statusText = correct ? '正确' : '错误'; }
      } else if (secId === 'judge') {
        correct = sa === q.answer;
        if (sa) { statusClass = correct ? 'auto-correct' : 'auto-wrong'; statusText = correct ? '正确' : '错误'; }
      }

      html += `<div class="grade-q"><div class="gq-header"><span class="gq-num">${q.id.replace(/^[AB]/,'')}</span><span class="gq-text">${q.text.replace(/\n/g,'<br>')}</span><span class="gq-score-badge">${q.score}分</span></div>`;
      html += `<div class="auto-score-display">考生答案：<strong>${displayAnswer}</strong> | 正确答案：<strong>${q.answer}</strong> | <span class="${statusClass}">${statusText}</span> | 得分：<strong>${correct ? q.score : 0}</strong>/${q.score}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });

  // Manual grading sections
  ['fill','essay'].forEach(secId => {
    const section = paper.sections.find(s => s.id === secId);
    if (!section) return;
    html += `<div class="grading-section"><h3>${section.name}（人工批改）</h3>`;
    section.questions.forEach(q => {
      const sa = sub.answers[q.id] || '未作答';
      const ms = sub.manualScores ? sub.manualScores[q.id] : '';
      html += `<div class="grade-q"><div class="gq-header"><span class="gq-num">${q.id.replace(/^[AB]/,'')}</span><span class="gq-text">${q.text.replace(/\n/g,'<br>')}</span><span class="gq-score-badge">${q.score}分</span></div>`;
      html += `<div class="gq-ref-label">考生答案：</div><div class="gq-student-answer">${sa || '（未作答）'}</div>`;
      html += `<div class="gq-ref-label">参考答案：</div><div class="gq-ref-answer">${q.answer.replace(/\n/g,'<br>')}</div>`;
      if (q.rubric) {
        html += `<div class="gq-ref-label">评分标准：</div><div class="gq-rubric">${q.rubric}</div>`;
      }
      if (!q.subQuestions || !q.subQuestions.length) {
        html += `<div class="grade-input-row"><label>评分：</label><input type="number" id="gscore_${q.id}" min="0" max="${q.score}" value="${ms!==undefined&&ms!==''?ms:''}" placeholder="0~${q.score}"> <span class="max-hint">满分${q.score}分</span></div>`;
      }
      // Sub-questions for essay
      if (q.subQuestions && q.subQuestions.length) {
        html += `<div style="margin:12px 0 8px;padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #f9a825"><strong>按小问评分：</strong></div>`;
        q.subQuestions.forEach(sq => {
          const ssa = sub.answers[sq.id] || '未作答';
          const sms = sub.manualScores ? sub.manualScores[sq.id] : '';
          html += `<div style="margin:8px 0;padding:10px;background:var(--gray);border-radius:6px">
            <div style="font-weight:600;margin-bottom:6px">${sq.label} ${sq.text} <span style="color:var(--primary)">（${sq.score}分）</span></div>
            <div class="gq-ref-label">考生答案：</div><div class="gq-student-answer">${ssa || '（未作答）'}</div>
            <div class="grade-input-row" style="margin-top:8px"><label>评分：</label><input type="number" id="gscore_${sq.id}" min="0" max="${sq.score}" value="${sms!==undefined&&sms!==''?sms:''}" placeholder="0~${sq.score}"> <span class="max-hint">满分${sq.score}分</span></div>
          </div>`;
        });
      }
      html += '</div>';
    });
    html += '</div>';
  });

  // Auto score display
  html += `<div style="padding:16px;background:var(--primary-light);border-radius:8px;margin-bottom:16px"><strong>客观题自动得分：${sub.autoScore}分</strong></div>`;

  // Save button
  html += `<div class="grade-actions"><button class="btn btn-primary" onclick="saveGrading()">保存批改结果</button></div>`;

  document.getElementById('grading-content').innerHTML = html;
}

function saveGrading() {
  const submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  const sub = submissions.find(s => s.id === currentGradingId);
  if (!sub) return;
  const paper = EXAM_DATA[sub.paperVersion];

  // Collect manual scores
  let manualScores = {};
  let allFilled = true;
  ['fill','essay'].forEach(secId => {
    const section = paper.sections.find(s => s.id === secId);
    if (!section) return;
    section.questions.forEach(q => {
      // Only collect main question score if no sub-questions
      if (!q.subQuestions || !q.subQuestions.length) {
        const input = document.getElementById('gscore_' + q.id);
        const val = input ? input.value.trim() : '';
        if (val === '') { allFilled = false; }
        else { manualScores[q.id] = Number(val); }
      }
      // Also collect sub-question scores
      if (q.subQuestions && q.subQuestions.length) {
        q.subQuestions.forEach(sq => {
          const sqInput = document.getElementById('gscore_' + sq.id);
          const sqVal = sqInput ? sqInput.value.trim() : '';
          if (sqVal === '') { allFilled = false; }
          else { manualScores[sq.id] = Number(sqVal); }
        });
      }
    });
  });

  sub.manualScores = manualScores;

  if (allFilled) {
    const manualTotal = Object.values(manualScores).reduce((a,b) => a + b, 0);
    sub.totalScore = sub.autoScore + manualTotal;
    sub.graded = true;
  } else {
    sub.graded = false;
    const manualTotal = Object.values(manualScores).reduce((a,b) => a + b, 0);
    sub.totalScore = null;
  }

  localStorage.setItem('exam_submissions', JSON.stringify(submissions));

  // Sync grading results to cloud
  cloudSyncManualScores(sub.id, sub.manualScores, sub.graded).then(ok => {
    if (ok) console.log('✅ 批改结果已同步到云端');
    else console.warn('⚠️ 批改结果云端同步失败');
  });

  if (allFilled) {
    alert('批改已保存！总分：' + sub.totalScore + '分');
  } else {
    alert('部分主观题未评分，已保存已填写的分数。全部评分完成后将自动计算总分。');
  }

  renderGrading(sub);
}

// ==================== NOTIFY STUDENT ====================
function notifyStudent(subId) {
  const url = location.origin + location.pathname + '#score=' + subId;
  const html = `<div class="score-link-area"><p>将以下链接发送给考生，考生可查看成绩：</p><code>${url}</code><p style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="copyLink('${url}')">复制链接</button></p></div>`;

  // Insert after grading content or show as modal
  const existing = document.querySelector('.score-link-area');
  if (existing) existing.remove();
  document.getElementById('grading-content').insertAdjacentHTML('beforeend', html);
}

function copyLink(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('链接已复制');
  }
}

// ==================== SCORE PAGE ====================
function showScorePage(subId) {
  const submissions = JSON.parse(localStorage.getItem('exam_submissions') || '[]');
  const sub = submissions.find(s => s.id === subId);
  if (!sub || !sub.graded) {
    hideAll();
    document.getElementById('score-page').classList.remove('hidden');
    document.getElementById('score-card').innerHTML = '<h2>成绩查询</h2><p style="text-align:center;color:var(--gray-dark)">暂无可用成绩，请确认链接是否正确或等待批改完成。</p>';
    return;
  }

  const paper = EXAM_DATA[sub.paperVersion];
  const sections = [
    { name: '单选题', score: 0, max: 0 },
    { name: '多选题', score: 0, max: 0 },
    { name: '判断题', score: 0, max: 0 },
    { name: '填空题', score: 0, max: 0 },
    { name: '简答题', score: 0, max: 0 }
  ];

  const secMap = { single: 0, multi: 1, judge: 2, fill: 3, essay: 4 };
  paper.sections.forEach(section => {
    const idx = secMap[section.id];
    section.questions.forEach(q => {
      sections[idx].max += q.score;
      if (['single','multi','judge'].includes(section.id)) {
        const sa = sub.answers[q.id];
        let correct = false;
        if (section.id === 'single') correct = sa === q.answer;
        else if (section.id === 'multi') {
          const sortedSa = (sa || []).sort().join('');
          const sortedAns = q.answer.split('').sort().join('');
          correct = sortedSa === sortedAns;
        } else if (section.id === 'judge') correct = sa === q.answer;
        if (correct) sections[idx].score += q.score;
      } else {
        const ms = sub.manualScores ? sub.manualScores[q.id] : 0;
        sections[idx].score += (Number(ms) || 0);
      }
    });
  });

  hideAll();
  document.getElementById('score-page').classList.remove('hidden');
  const isFail = sub.totalScore < 90;
  const failMsg = isFail ? '<div style="background:#fce8e6;color:var(--danger);padding:12px;border-radius:8px;font-size:1.1rem;font-weight:700;margin-bottom:16px;text-align:center">&#9888;&#65039; 成绩未达到及格线（90分），成绩评定为：不及格</div>' : '<div style="background:#e6f4ea;color:#137333;padding:8px;border-radius:8px;font-size:.9rem;margin-bottom:16px;text-align:center">&#9989; 成绩合格</div>';
  let html = `<h2>品质文化能力测评成绩</h2>${failMsg}<div class="student-info">工号：${sub.empId || '-'} | 考生：${sub.name} | 基地部门：${sub.department} | 试卷：${sub.paperVersion}卷</div><div class="total-score" style="${isFail?'color:var(--danger)':''}">${sub.totalScore} <small>/ ${paper.total}分</small></div><table><thead><tr><th>题型</th><th>得分</th><th>满分</th></tr></thead><tbody>`;
  sections.forEach(s => {
    html += `<tr><td>${s.name}</td><td>${s.score}</td><td>${s.max}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('score-card').innerHTML = html;
}

route();
